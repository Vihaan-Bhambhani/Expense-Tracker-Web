name: Live Streamlit End-to-End Smoke Test

on:
  push:
    branches:
      - qa/live-browser-smoke-20261012
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pytest
          python -m playwright install --with-deps chromium
      - name: Run live end-to-end smoke tests
        env:
          APP_KIND: expense
          BASE_URL: https://expense-tracker-web-vb.streamlit.app/
        run: |
          python -m pytest -v -s qa/test_live_app.py --junitxml=qa-results.xml
      - name: Upload browser screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-results
          path: |
            qa-artifacts/
            qa-results.xml
          if-no-files-found: warn
